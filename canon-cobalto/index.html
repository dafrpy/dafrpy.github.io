<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1b1322">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Cañón Cobalto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* Layout: one full-height canvas column (letterboxed on wide screens) with a DOM card overlay for menus.
   Single committed look: sunset canyon + cobalt river, arcade signage type. */
:root{
  color-scheme: dark;
  --land:#b4633a; --land-dk:#7c3d22; --sand:#e9b97f; --water:#1f6f8f; --foam:#a9dde6;
  --scrub:#5d7834; --ink:#1b1322; --ink-2:#2c2236; --cream:#f6ecd6; --accent:#ffb627;
  --danger:#ef4b31; --cobalt:#3d7be3; --veil:rgba(27,19,34,.55);
  --display:'Bungee','Arial Black',Impact,system-ui,sans-serif;
  --ui:'Chakra Petch',ui-monospace,'SF Mono',Menlo,monospace;
}
html{box-sizing:border-box;height:100%}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--ink);color:var(--cream);overflow:hidden;overscroll-behavior:none;
  font-family:var(--ui);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#stage{position:relative;height:100%;display:flex;justify-content:center;background:var(--land-dk);touch-action:none;overflow:hidden}
canvas{display:block;height:100%;touch-action:none}
#btns{position:absolute;top:10px;right:max(10px,env(safe-area-inset-right,0px));display:flex;gap:8px;z-index:3}
#btns button{width:42px;height:42px;border-radius:50%;border:2px solid var(--cream);background:var(--veil);color:var(--cream);
  display:grid;place-items:center;padding:0;cursor:pointer}
#btns button svg{width:20px;height:20px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--cream);border-radius:4px;overflow:hidden}
.seg button{font-family:var(--ui);font-weight:700;font-size:14px;color:var(--cream);background:none;border:0;padding:10px 6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--cream);color:var(--ink)}
.seg button:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
#btns button:focus-visible,.go:focus-visible,.ghost:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.overlay{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;background:var(--veil);
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{width:min(340px,100%);max-height:100%;overflow:auto;background:var(--ink);border:2px solid var(--cream);border-radius:6px;
  box-shadow:6px 6px 0 var(--accent);padding:22px 20px;display:flex;flex-direction:column;gap:14px;touch-action:pan-y}
.logo{margin:0;font-family:var(--display);font-weight:400;line-height:.92;display:flex;flex-direction:column;font-size:44px;letter-spacing:.01em}
.logo .a{color:var(--sand);text-shadow:3px 3px 0 var(--land-dk)}
.logo .b{color:var(--cobalt);text-shadow:3px 3px 0 var(--cream)}
.tag{margin:0;font-size:15px;line-height:1.4;color:var(--cream);opacity:.9}
.how{margin:0;padding:0;list-style:none;display:grid;gap:7px;font-size:14px;line-height:1.35}
.how li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start}
.how .k{font-family:var(--display);font-size:12px;color:var(--ink);background:var(--accent);border-radius:3px;text-align:center;line-height:20px;height:20px}
.how b{color:var(--accent);font-weight:700}
.go{font-family:var(--display);font-size:20px;letter-spacing:.04em;color:var(--ink);background:var(--accent);border:0;border-radius:4px;
  padding:14px 16px;cursor:pointer;box-shadow:0 4px 0 var(--land-dk)}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 var(--land-dk)}
.ghost{font-family:var(--ui);font-weight:700;font-size:14px;color:var(--cream);background:none;border:2px solid var(--ink-2);border-radius:4px;padding:10px;cursor:pointer}
.rec{margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.8;font-variant-numeric:tabular-nums}
.big{font-family:var(--display);font-size:48px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.75;margin:0}
.new{color:var(--ink);background:var(--cobalt);align-self:flex-start;padding:3px 8px;border-radius:3px;font-weight:700;font-size:13px}
h2.t{margin:0;font-family:var(--display);font-weight:400;font-size:30px;color:var(--cream);line-height:1}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" aria-label="Juego Cañón Cobalto"></canvas>
  <div id="btns">
    <button id="muteBtn" type="button" aria-label="Silenciar sonido">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path id="waves" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path id="xmark" d="M16 9l6 6M22 9l-6 6" style="display:none"/></svg>
    </button>
    <button id="pauseBtn" type="button" aria-label="Pausar">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
    </button>
  </div>
  <div id="overlay" class="overlay"><div class="card" id="card"></div></div>
</div>

<script>
(() => {
'use strict';
// ---------- constants ----------
const W = 360, ROW = 6, SEC_ROWS = 420, SEC_LEN = SEC_ROWS * ROW;
const HUD_H = 58, PY = HUD_H + 96;            // player's height above the bottom edge (world units)
const NECK_W = 108, BRIDGE_ROW = SEC_ROWS - 22;
const PTS = { boat: 30, heli: 60, jet: 100, fuel: 80, bridge: 500 };
const SIZES = { boat: [34, 12], heli: [28, 18], jet: [28, 12], fuel: [24, 38] };
const HI_KEY = 'canon-cobalto-record';
// single shot; each weapon level raises its damage
const DMG = [0, 1, 2, 3, 4, 6];
const HP = { boat: 2, heli: 3, jet: 2, fuel: 1 };
const WEAPON_STEP = 5000, FIRE_CD = 0.24, MAX_BULLETS = 2;

const cs = getComputedStyle(document.documentElement);
const v = n => cs.getPropertyValue(n).trim();
const C = { land: v('--land'), landDk: v('--land-dk'), sand: v('--sand'), water: v('--water'), foam: v('--foam'),
  scrub: v('--scrub'), ink: v('--ink'), ink2: v('--ink-2'), cream: v('--cream'), accent: v('--accent'),
  danger: v('--danger'), cobalt: v('--cobalt') };
const UI = "'Chakra Petch', ui-monospace, monospace", DISP = "'Bungee', 'Arial Black', Impact, sans-serif";
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');
let scale = 1, dpr = 1, H = 640;

const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(n) { n |= 0; n = Math.imul(n ^ (n >>> 16), 0x45d9f3b); n = Math.imul(n ^ (n >>> 16), 0x45d9f3b); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; }

// ---------- river generation (deterministic per section) ----------
const sections = new Map();
function genSection(s) {
  const rnd = mulberry32(s * 7919 + 101);
  const d = clamp(s, 0, 10);
  const L = new Float32Array(SEC_ROWS), R = new Float32Array(SEC_ROWS), IL = new Float32Array(SEC_ROWS), IR = new Float32Array(SEC_ROWS);
  let c = W / 2, w = NECK_W, iw = 0, tc = c, tw = w, tiw = 0, hold = 0;
  for (let i = 0; i < SEC_ROWS; i++) {
    const neck = i < 10 || i > SEC_ROWS - 110;
    if (neck) { tc = W / 2; tw = NECK_W; tiw = 0; hold = 0; }
    else if (--hold <= 0) {
      hold = 22 + (rnd() * 40 | 0);
      const maxW = 290 - d * 8, minW = 118 - d * 2;
      tw = minW + rnd() * (maxW - minW);
      const lo = 10 + tw / 2, hi = W - 10 - tw / 2;
      tc = lo + rnd() * (hi - lo);
      tiw = (tw > 215 && rnd() < 0.5) ? Math.min(tw - 150, 36 + rnd() * 110) : 0;
    }
    const k = neck ? 1.6 : 1;
    c += clamp(tc - c, -1.3 * k, 1.3 * k);
    w += clamp(tw - w, -2.4 * k, 2.4 * k);
    iw += clamp(tiw - iw, -2.6 * k, 2.6 * k);
    if (iw > w - 150) iw = Math.max(0, w - 150);
    c = clamp(c, 8 + w / 2, W - 8 - w / 2);
    if (i >= SEC_ROWS - 32) { c = W / 2; w = NECK_W; iw = 0; }
    L[i] = c - w / 2; R[i] = c + w / 2;
    if (iw > 0.5) { IL[i] = c - iw / 2; IR[i] = c + iw / 2; } else { IL[i] = IR[i] = c; }
  }
  return { L, R, IL, IR };
}
function getSection(s) {
  let sec = sections.get(s);
  if (sec) return sec;
  sec = genSection(s); sections.set(s, sec);
  if (sections.size > 8) for (const k of [...sections.keys()]) if (Math.abs(k - s) > 3) sections.delete(k);
  return sec;
}
function row(k, o) {
  const s = Math.floor(k / SEC_ROWS), i = k - s * SEC_ROWS, sec = getSection(s);
  o.L = sec.L[i]; o.R = sec.R[i]; o.IL = sec.IL[i]; o.IR = sec.IR[i];
  return o;
}
const _a = {}, _b = {};
function isWater(x, wy) {
  const f = wy / ROW, k = Math.floor(f), t = f - k;
  row(k, _a); row(k + 1, _b);
  const L = _a.L + (_b.L - _a.L) * t, R = _a.R + (_b.R - _a.R) * t;
  if (x <= L || x >= R) return false;
  const IL = _a.IL + (_b.IL - _a.IL) * t, IR = _a.IR + (_b.IR - _a.IR) * t;
  return !(IR - IL > 1 && x > IL && x < IR);
}

// ---------- game state ----------
let state = 'title', paused = false;
let camY = 0, px = W / 2, pvx = 0, tilt = 0, fuel = 1, lives = 3, score = 0, checkpoint = 0, nextLifeAt = 10000;
let weaponLv = 1, speed = 0, fireCd = 0, deadT = 0, readyT = 0, shake = 0, lowT = 0, refT = 0, engT = 0, sec = 0;
let ents = [], bullets = [], parts = [], texts = [];
const spawned = new Set();
let hi = 0; try { hi = +localStorage.getItem(HI_KEY) || 0; } catch (e) { }

function spawnSection(s) {
  const rnd = mulberry32(s * 104729 + 7), d = clamp(s, 0, 10);
  let r = 48, nextFuel = 40 + (rnd() * 25 | 0);
  while (r < SEC_ROWS - 40) {
    let type;
    if (r >= nextFuel) { type = 'fuel'; nextFuel = r + 70 + (rnd() * 40 | 0) + d * 5; }
    else { const p = rnd(); type = (s >= 1 && p < 0.1 + d * 0.015) ? 'jet' : p < 0.55 ? 'boat' : 'heli'; }
    placeEntity(type, s * SEC_LEN + r * ROW, rnd, d);
    r += Math.max(8, (15 + rnd() * 14 - d * 1.3) | 0);
  }
  const bhp = 6 + Math.floor(d / 2);
  ents.push({ type: 'bridge', x: W / 2, wy: s * SEC_LEN + BRIDGE_ROW * ROW, w: NECK_W + 26, h: 14, sec: s, on: false, hp: bhp, maxHp: bhp });
}
function placeEntity(type, wy, rnd, d) {
  const [w, h] = SIZES[type];
  const hp = HP[type] + (type === 'fuel' ? 0 : Math.floor(d / 3));
  if (type === 'jet') {
    const dir = rnd() < 0.5 ? 1 : -1;
    ents.push({ type, x: dir > 0 ? -30 : W + 30, wy, w, h, vx: dir * (160 + d * 10), face: dir, on: false, hp, maxHp: hp });
    return;
  }
  const o = row(Math.floor(wy / ROW), {});
  const chans = (o.IR - o.IL > 1) ? [[o.L, o.IL], [o.IR, o.R]] : [[o.L, o.R]];
  for (let t = 0; t < 4; t++) {
    const ch = chans[(rnd() * chans.length) | 0];
    const room = ch[1] - ch[0] - w - 10;
    if (room < 0) continue;
    const x = ch[0] + 5 + w / 2 + rnd() * room;
    if (isWater(x - w / 2 - 3, wy - h / 2) && isWater(x + w / 2 + 3, wy - h / 2) &&
        isWater(x - w / 2 - 3, wy + h / 2) && isWater(x + w / 2 + 3, wy + h / 2)) {
      const mover = type !== 'fuel' && rnd() < (type === 'heli' ? 0.7 : 0.45) + d * 0.05;
      const sp = (type === 'heli' ? 65 : 48) + d * 8, dir = rnd() < 0.5 ? -1 : 1;
      ents.push({ type, x, wy, w, h, vx: mover ? dir * sp : 0, face: dir, mover, moving: false, on: false, hp, maxHp: hp });
      return;
    }
  }
}
function ensureSpawn(s) { if (s >= 0 && !spawned.has(s)) { spawned.add(s); spawnSection(s); } }

function newGame() {
  score = 0; lives = 3; checkpoint = 0; nextLifeAt = 10000; weaponLv = 1;
  respawn();
}
function respawn() {
  ents = []; bullets = []; parts = []; texts = []; spawned.clear();
  camY = checkpoint * SEC_LEN; px = W / 2; pvx = 0; tilt = 0; fuel = 1; speed = 40; fireCd = 0.4;
  readyT = 1.5; state = 'play'; ori.needCal = true;
}
function crash() {
  if (state !== 'play') return;
  state = 'dead'; deadT = 2; lives--;
  explode(px, camY + PY, [C.accent, C.cream, C.danger, C.ink], 46, 170);
  shake = 12; boom(0.9, 0.7); buzz([60, 40, 120]);
}
function gameOver() {
  state = 'over';
  const isNew = score > hi;
  if (isNew) { hi = score; try { localStorage.setItem(HI_KEY, String(hi)); } catch (e) { } }
  showOverlay('over', isNew);
}
function addScore(n, x, wy) {
  score += n;
  texts.push({ x, wy, txt: '+' + n, life: 0.9 });
  const lv = Math.min(DMG.length - 1, 1 + Math.floor(score / WEAPON_STEP));
  if (lv > weaponLv) {
    weaponLv = lv;
    texts.push({ x: W / 2, wy: camY + H * 0.62, txt: 'ARMA NIVEL ' + lv, life: 1.8, big: true });
    tone(392, 1568, 0.4, 'square', 0.1); buzz([30, 40, 30]);
  }
  if (score >= nextLifeAt) { nextLifeAt += 10000; lives = Math.min(lives + 1, 9);
    texts.push({ x: W / 2, wy: camY + H * 0.55, txt: '+1 AVIÓN', life: 1.6, big: true }); tone(523, 1046, 0.35, 'square', 0.12); }
}
function killEntity(e) {
  e.dead = true;
  const cols = e.type === 'fuel' ? [C.accent, C.danger, C.cream] : e.type === 'bridge' ? [C.ink2, C.accent, C.cream, C.danger]
    : e.type === 'heli' ? [C.scrub, C.cream, C.accent] : [C.danger, C.cream, C.ink];
  explode(e.x, e.wy, cols, e.type === 'bridge' ? 60 : 24, e.type === 'bridge' ? 160 : 110);
  addScore(PTS[e.type], e.x, e.wy);
  if (e.type === 'bridge') {
    checkpoint = Math.max(checkpoint, e.sec + 1);
    texts.push({ x: W / 2, wy: e.wy + 40, txt: 'AVANCE GUARDADO', life: 1.6, big: true });
    boom(0.8, 0.6); shake = 8; buzz(70);
  } else { boom(0.35, 0.35); buzz(25); }
}
function explode(x, wy, cols, n, sp) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = sp * (0.25 + Math.random());
    parts.push({ x, wy, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.7, max: 1.2,
      c: cols[(Math.random() * cols.length) | 0], r: 2 + Math.random() * 3.5 });
  }
  parts.push({ ring: true, x, wy, life: 0.35, max: 0.35, r: sp * 0.35 });
}

// ---------- input ----------
// touches in the lower part of the screen fire (and can still steer sideways);
// touches above steer and set the throttle
const FIRE_FRAC = 0.72, MODE_KEY = 'canon-cobalto-control';
const ptrs = new Map();
let steerThr = 0, fireHeld = false;
const keys = new Set();
function refreshFire() { fireHeld = false; for (const p of ptrs.values()) if (p.fire) fireHeld = true; }
function releaseFire() { ptrs.clear(); fireHeld = false; steerThr = 0; }
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('button, .overlay')) return;
  audioInit();
  if (state !== 'play' || paused) return;
  const r = stage.getBoundingClientRect();
  const fire = (e.clientY - r.top) / r.height >= FIRE_FRAC;
  ptrs.set(e.pointerId, { lastX: e.clientX, startY: e.clientY, fire });
  refreshFire();
  try { stage.setPointerCapture(e.pointerId); } catch (err) { }
});
stage.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId);
  if (!p) return;
  if (state === 'play' && !paused) px += (e.clientX - p.lastX) / scale * 1.1;
  p.lastX = e.clientX;
  if (!p.fire) {
    const dv = (p.startY - e.clientY) / scale;
    steerThr = Math.sign(dv) * clamp((Math.abs(dv) - 14) / 40, 0, 1);
  }
});
const endPtr = e => {
  const p = ptrs.get(e.pointerId);
  if (!p) return;
  ptrs.delete(e.pointerId);
  if (!p.fire) steerThr = 0;
  refreshFire();
};

// tilt control (device orientation); falls back to touch when the browser sends nothing
let ctrlMode = 'tilt';
try { ctrlMode = localStorage.getItem(MODE_KEY) || 'tilt'; } catch (e) { }
const ori = { g: 0, b: 0, g0: 0, b0: 0, seen: false, needCal: true, listening: false, warned: false };
let tiltThr = 0;
function onOrient(e) {
  if (e.gamma == null || e.beta == null) return;
  ori.seen = true; ori.g = e.gamma; ori.b = e.beta;
  if (ori.needCal) { ori.g0 = e.gamma; ori.b0 = e.beta; ori.needCal = false; }
}
function enableTilt() {
  if (ori.listening) return;
  const listen = () => { if (!ori.listening) { ori.listening = true; addEventListener('deviceorientation', onOrient); } };
  try {
    const D = window.DeviceOrientationEvent;
    if (D && typeof D.requestPermission === 'function') D.requestPermission().then(r => { if (r === 'granted') listen(); }).catch(() => { });
    else listen();
  } catch (e) { }
}
function setMode(m) {
  ctrlMode = m;
  try { localStorage.setItem(MODE_KEY, m); } catch (e) { }
  if (m === 'tilt') enableTilt();
  showOverlay('title');
}
stage.addEventListener('pointerup', endPtr);
stage.addEventListener('pointercancel', endPtr);
stage.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
addEventListener('keydown', e => {
  const k = e.key;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(k)) e.preventDefault();
  keys.add(k.toLowerCase());
  if ((k === 'Enter' || k === ' ') && (state === 'title' || state === 'over')) { if (ctrlMode === 'tilt') enableTilt(); audioInit(); hideOverlay(); newGame(); }
  else if ((k === 'p' || k === 'P' || k === 'Escape') && state === 'play') setPaused(!paused);
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
stage.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('blur', () => { keys.clear(); releaseFire(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') setPaused(true); });

// ---------- overlay ----------
const overlay = document.getElementById('overlay'), card = document.getElementById('card');
const fmt = n => n.toLocaleString('es');
function showOverlay(mode, isNew) {
  if (mode === 'title') {
    card.innerHTML = `
      <h1 class="logo"><span class="a">Cañón</span><span class="b">Cobalto</span></h1>
      <p class="tag">Vuela río arriba entre los acantilados. Derriba lo que se cruce y no te quedes sin combustible.</p>
      <div class="seg" role="group" aria-label="Forma de controlar el avión">
        <button type="button" id="mTilt" aria-pressed="${ctrlMode === 'tilt'}">Inclinar celular</button>
        <button type="button" id="mDrag" aria-pressed="${ctrlMode !== 'tilt'}">Deslizar dedo</button>
      </div>
      <ul class="how">
        ${ctrlMode === 'tilt' ? `
        <li><span class="k">↔</span><span><b>Inclina</b> el celular a los lados para girar</span></li>
        <li><span class="k">↕</span><span>Inclínalo <b>hacia adelante</b> para acelerar y <b>hacia atrás</b> para frenar. La posición al despegar es el punto neutro</span></li>` : `
        <li><span class="k">↔</span><span><b>Desliza</b> a los lados para girar</span></li>
        <li><span class="k">↕</span><span>En la parte de arriba, desliza <b>arriba</b> para acelerar y <b>abajo</b> para frenar</span></li>`}
        <li><span class="k">•</span><span><b>Mantén el dedo en la parte de abajo</b> de la pantalla para disparar</span></li>
        <li><span class="k">+</span><span>Los enemigos aguantan varios impactos. Cada <b>5.000 puntos</b> tu disparo es más potente</span></li>
        <li><span class="k">◆</span><span>Pasa sobre las <b>barcazas con gota</b> para recargar. Ojo: tus disparos las destruyen</span></li>
        <li><span class="k">═</span><span>Vuela los <b>puentes</b>: ahí reapareces si caes</span></li>
      </ul>
      <button class="go" id="go" type="button">Despegar</button>

// ---------- update ----------
function update(dt) {
  // particles & texts always animate
  for (const p of parts) { p.life -= dt; if (!p.ring) { p.x += p.vx * dt; p.wy += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; } }
  parts = parts.filter(p => p.life > 0);
  for (const t of texts) { t.life -= dt; t.wy += 30 * dt; }
  texts = texts.filter(t => t.life > 0);
  shake = Math.max(0, shake - dt * 30);

  if (state === 'title') { camY += 45 * dt; return; }
  if (state === 'dead') {
    deadT -= dt;
    if (deadT <= 0) { if (lives > 0) respawn(); else gameOver(); }
    return;
  }
  if (state !== 'play') return;

  readyT -= dt;
  const pwy = camY + PY;
  sec = Math.floor(pwy / SEC_LEN);

  // steering & throttle
  const oldX = px;
  if (keys.has('arrowleft') || keys.has('a')) px -= 200 * dt;
  if (keys.has('arrowright') || keys.has('d')) px += 200 * dt;
  if (ctrlMode === 'tilt' && ori.seen) {
    const dg = ori.g - ori.g0;
    px += Math.sign(dg) * clamp((Math.abs(dg) - 2) / 20, 0, 1) * 270 * dt;
    const db = ori.b0 - ori.b;
    tiltThr = Math.sign(db) * clamp((Math.abs(db) - 5) / 15, 0, 1);
  } else tiltThr = 0;
  if (ctrlMode === 'tilt' && !ori.seen && !ori.warned && readyT < -1.5) {
    ori.warned = true;
    texts.push({ x: W / 2, wy: camY + H * 0.55, txt: 'GIRA CON EL DEDO', life: 2.4, big: true });
  }
  px = clamp(px, 6, W - 6);
  pvx = pvx * 0.7 + ((px - oldX) / Math.max(dt, 0.001)) * 0.3;
  tilt += (clamp(pvx / 220, -1, 1) - tilt) * Math.min(1, dt * 10);
  const keyThr = (keys.has('arrowup') || keys.has('w') ? 1 : 0) - (keys.has('arrowdown') || keys.has('s') ? 1 : 0);
  const thr = keyThr || steerThr || tiltThr;
  const base = Math.min(105 + sec * 7, 170);
  const target = thr > 0 ? base * (1 + 0.8 * thr) : base * (1 + 0.5 * thr);
  speed += (target - speed) * Math.min(1, dt * 3);
  camY += speed * dt;

  engT -= dt;
  if (engT <= 0) { engT = 0.1; setEngine(!paused, clamp((speed - 50) / 180, 0, 1)); }

  ensureSpawn(Math.floor(camY / SEC_LEN));
  ensureSpawn(Math.floor(camY / SEC_LEN) + 1);

  // fuel

  // shooting (hold the fire button)
  fireCd -= dt;
  const firing = fireHeld || keys.has(' ') || keys.has('j');
  if (firing && fireCd <= 0 && bullets.length < MAX_BULLETS) {
    bullets.push({ x: px, wy: pwy + 16, dmg: DMG[weaponLv] });
    fireCd = FIRE_CD; tone(1400 - weaponLv * 120, 400, 0.08, weaponLv > 2 ? 'square' : 'triangle', 0.05 + weaponLv * 0.008);
  }
  for (const b of bullets) b.wy += (520 + weaponLv * 30 + speed) * dt;

  // entities
  const P = camY + PY;
  for (const e of ents) {
    if (e.dead) continue;
    if (!e.on && e.wy - camY < H + 30) e.on = true;
    if (!e.on) continue;
    if (e.hitT > 0) e.hitT -= dt;
    if (e.type === 'jet') { e.x += e.vx * dt; if (e.x < -60 || e.x > W + 60) e.gone = true; continue; }
    if (e.mover && !e.moving && e.wy - P < 320) e.moving = true;
    if (e.moving) {

      if (!isWater(edge, e.wy) || !isWater(edge, e.wy + e.h / 2) || !isWater(edge, e.wy - e.h / 2)) e.vx = -e.vx;
      else e.x = nx;
      e.face = Math.sign(e.vx);
    }
  }
  // bullets vs entities
  for (const b of bullets) {
    if (b.dead) continue;
    for (const e of ents) {
      if (e.dead || !e.on) continue;
      if (Math.abs(b.x - e.x) < e.w / 2 + 3 && Math.abs(b.wy - e.wy) < e.h / 2 + 8) {
        b.dead = true; e.hp -= b.dmg;
        if (e.hp <= 0) killEntity(e);

          for (let i = 0; i < 6; i++) { const a = Math.random() * 6.283, s = 60 + Math.random() * 80;
            parts.push({ x: b.x, wy: e.wy - e.h / 2, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.25 + Math.random() * 0.2, max: 0.45, c: C.cream, r: 2 }); }
        }
        break;
      }
    }
  }
  bullets = bullets.filter(b => !b.dead && b.wy < camY + H + 20 && b.x > -10 && b.x < W + 10);

  // player vs terrain
  const probes = [[0, 15], [-12, -4], [12, -4], [-6, -13], [6, -13]];
  for (const [dx, dy] of probes) if (!isWater(px + dx, P + dy)) { crash(); return; }
  // player vs entities
  let refueling = false;
  for (const e of ents) {
    if (e.dead || !e.on) continue;
    if (Math.abs(px - e.x) < e.w / 2 + 8 && Math.abs(P - e.wy) < e.h / 2 + 11) {

  ctx.globalAlpha = 1;
  ctx.scale(1 - Math.abs(tilt) * 0.3, 1);
  playerShape(false, tilt);
  ctx.restore();
}
function drawHUD(t) {
  // fire zone
  const zy = H * FIRE_FRAC, zh = H - HUD_H - zy;
  ctx.fillStyle = fireHeld ? 'rgba(255,182,39,.14)' : 'rgba(27,19,34,.16)';
  ctx.fillRect(0, zy, W, zh);
  ctx.strokeStyle = fireHeld ? C.accent : C.cream; ctx.globalAlpha = fireHeld ? 0.7 : 0.35;
  ctx.setLineDash([6, 6]); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0, zy); ctx.lineTo(W, zy); ctx.stroke(); ctx.setLineDash([]);
  ctx.globalAlpha = 1;
  if (state === 'play' && readyT > -3) {
    ctx.textAlign = 'center'; ctx.font = `700 11px ${UI}`; ctx.fillStyle = C.cream; ctx.globalAlpha = 0.75;
    ctx.fillText('MANTÉN EL DEDO AQUÍ PARA DISPARAR', W / 2, zy + 18);
    ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }
  // top: score + record
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  ctx.font = `700 24px ${UI}`; ctx.lineWidth = 4; ctx.strokeStyle = C.ink; ctx.fillStyle = C.cream;
  const sc = fmt(score);
  ctx.strokeText(sc, 14, 34); ctx.fillText(sc, 14, 34);
  ctx.font = `700 11px ${UI}`; ctx.lineWidth = 3;
  const rc = 'RÉCORD ' + fmt(Math.max(hi, score));
  ctx.strokeText(rc, 14, 50); ctx.fillStyle = C.sand; ctx.fillText(rc, 14, 50);
  const wl = 'ARMA NV ' + weaponLv + ' · DAÑO ' + DMG[weaponLv] + (weaponLv < DMG.length - 1 ? '' : ' MÁX');
  ctx.strokeText(wl, 14, 65); ctx.fillStyle = C.accent; ctx.fillText(wl, 14, 65);

  // bottom band
  const y0 = H - HUD_H;
  ctx.fillStyle = C.ink; ctx.fillRect(0, y0, W, HUD_H);
  ctx.fillStyle = C.accent; ctx.fillRect(0, y0, W, 2);
  // lives
  for (let i = 0; i < Math.min(lives, 4); i++) {
    ctx.save(); ctx.translate(20 + i * 20, y0 + 28); ctx.scale(0.55, 0.55); playerShape(false, 0); ctx.restore();
  }
  if (lives > 4) { ctx.fillStyle = C.cream; ctx.font = `700 12px ${UI}`; ctx.fillText('×' + lives, 96, y0 + 33); }
  // fuel gauge
  const gx = 122, gw = 132, gy = y0 + 18, gh = 16;
  ctx.font = `700 9px ${UI}`; ctx.fillStyle = C.sand; ctx.textAlign = 'center';
  ctx.fillText('COMBUSTIBLE', gx + gw / 2, y0 + 13);
  const low = fuel < 0.25, blink = low && Math.floor(t * 4) % 2 === 0;
  ctx.fillStyle = C.ink2; ctx.fillRect(gx, gy, gw, gh);
  ctx.fillStyle = fuel > 0.5 ? C.foam : fuel > 0.25 ? C.accent : C.danger;
  if (!blink) ctx.fillRect(gx + 2, gy + 2, (gw - 4) * fuel, gh - 4);
  ctx.strokeStyle = C.cream; ctx.lineWidth = 1.5; ctx.strokeRect(gx, gy, gw, gh);
  ctx.fillStyle = C.cream; ctx.font = `700 10px ${UI}`;
  [['V', 0], ['½', 0.5], ['LL', 1]].forEach(([l, f]) => { ctx.fillRect(gx + gw * f - 0.75, gy + gh, 1.5, 4); ctx.fillText(l, gx + gw * f, gy + gh + 14); });
  // section
  ctx.textAlign = 'right'; ctx.font = `700 9px ${UI}`; ctx.fillStyle = C.sand; ctx.fillText('TRAMO', W - 14, y0 + 22);
  ctx.font = `20px ${DISP}`; ctx.fillStyle = C.cream; ctx.fillText(String(sec + 1), W - 14, y0 + 44);
  ctx.textAlign = 'left';
}
function drawEnt(e, t) {
  const f = e.type === 'bridge' ? drawBridge : e.type === 'fuel' ? drawFuel : e.type === 'boat' ? drawBoat : e.type === 'heli' ? drawHeli : drawJet;
  f(e, t);
  if (e.hitT > 0) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.8; f(e, t); ctx.restore(); }
  if (e.maxHp > 1 && e.hp < e.maxHp) {
    const y = sY(e.wy) - e.h / 2 - 9, bw = Math.min(e.w, 40);
    ctx.fillStyle = C.ink; ctx.fillRect(e.x - bw / 2 - 1, y - 1, bw + 2, 5);
    ctx.fillStyle = C.accent; ctx.fillRect(e.x - bw / 2, y, bw * e.hp / e.maxHp, 3);
  }
}
function draw(t) {
  ctx.save();
  if (shake > 0 && !reduceMotion) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawTerrain();
  if (state !== 'title') {
    for (const e of ents) { if (e.dead) continue; const y = sY(e.wy); if (y < -40 || y > H + 40) continue;
      if (e.type === 'bridge' || e.type === 'fuel' || e.type === 'boat') drawEnt(e, t); }
    for (const e of ents) { if (e.dead || e.type !== 'heli') continue; const y = sY(e.wy); if (y > -40 && y < H + 40) drawEnt(e, t); }
    // speed streaks
    if (state === 'play' && speed > 170) {
      ctx.strokeStyle = C.cream; ctx.globalAlpha = Math.min(0.35, (speed - 170) / 200); ctx.lineWidth = 1; ctx.beginPath();
      for (let i = 0; i < 6; i++) { const x = hash(i * 31 + Math.floor(t * 12)) * W, y = hash(i * 57 + Math.floor(t * 12)) * H; ctx.moveTo(x, y); ctx.lineTo(x, y + 30); }
      ctx.stroke(); ctx.globalAlpha = 1;
    }
    const bw = 2 + weaponLv, bl = 8 + weaponLv * 3, bc = [C.accent, C.accent, C.accent, C.foam, C.cobalt, C.danger][weaponLv];
    for (const b of bullets) {
      const y = sY(b.wy);
      if (weaponLv > 1) { ctx.fillStyle = bc; ctx.globalAlpha = 0.4; ctx.fillRect(b.x - bw, y - bl / 2 - 3, bw * 2, bl + 6); ctx.globalAlpha = 1; }
      ctx.fillStyle = weaponLv > 1 ? C.cream : C.accent; ctx.fillRect(b.x - bw / 2, y - bl / 2, bw, bl);
    }
    if (state === 'play') drawPlayer(t);
    for (const e of ents) { if (!e.dead && e.type === 'jet' && e.on) drawEnt(e, t); }
    for (const p of parts) {
      const y = sY(p.wy);
      if (p.ring) { const k = 1 - p.life / p.max; ctx.strokeStyle = C.cream; ctx.globalAlpha = 1 - k; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(p.x, y, 6 + p.r * k, 0, 6.283); ctx.stroke(); }
      else { ctx.globalAlpha = clamp(p.life / 0.6, 0, 1); ctx.fillStyle = p.c; ctx.fillRect(p.x - p.r / 2, y - p.r / 2, p.r, p.r); }
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center';
    for (const tx of texts) {
      const y = sY(tx.wy); ctx.globalAlpha = clamp(tx.life / 0.4, 0, 1);
      ctx.font = tx.big ? `18px ${DISP}` : `700 13px ${UI}`; ctx.lineWidth = 3; ctx.strokeStyle = C.ink; ctx.fillStyle = tx.big ? C.accent : C.cream;
      ctx.strokeText(tx.txt, tx.x, y); ctx.fillText(tx.txt, tx.x, y);
    }
    ctx.globalAlpha = 1;
    if (state === 'play' && readyT > 0) {
      ctx.font = `30px ${DISP}`; ctx.lineWidth = 5; ctx.strokeStyle = C.ink; ctx.fillStyle = C.accent;
      ctx.strokeText('¡DESPEGUE!', W / 2, H * 0.4); ctx.fillText('¡DESPEGUE!', W / 2, H * 0.4);
      ctx.font = `700 13px ${UI}`; ctx.fillStyle = C.cream; ctx.lineWidth = 3;
      const s = 'TRAMO ' + (Math.floor((camY + PY) / SEC_LEN) + 1);
      ctx.strokeText(s, W / 2, H * 0.4 + 24); ctx.fillText(s, W / 2, H * 0.4 + 24);
    }
    ctx.textAlign = 'left';
  }
  ctx.restore();
  if (state !== 'title') drawHUD(t);
}

// ---------- sizing & loop ----------
function resize() {
  const r = stage.getBoundingClientRect();
  const ch = Math.max(200, r.height), gw = Math.min(r.width, ch * 0.7);
  canvas.style.width = gw + 'px'; canvas.style.height = ch + 'px';
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  canvas.width = Math.round(gw * dpr); canvas.height = Math.round(ch * dpr);
  scale = gw / W; H = ch / scale;
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (!paused) update(dt);
  if (state !== 'play' && ptrs.size) releaseFire();
  if (state !== 'play' || paused) { if (A.ctx && A.engG) setEngine(false, 0); }
  draw(now / 1000);
  requestAnimationFrame(frame);
}
showOverlay('title');
requestAnimationFrame(frame);
})();
</script>
